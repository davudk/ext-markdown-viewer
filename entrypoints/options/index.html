<!doctype html>
<!-- data-theme starts at the default so the first paint follows the OS; App.tsx
     replaces it once the saved Theme has loaded. -->
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Viewer settings</title>
    <!-- A full tab rather than the embedded dialog: this is a settings screen
         with room for a site list, not a 320px panel. -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
